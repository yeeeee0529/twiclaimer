<!doctype html>
<!-- S1.5 click/hover 的 mock 頁：可見（成功路徑）、disabled、hidden、被遮住、
     觸發同頁導覽的按鈕，與滑鼠事件計數。 -->
<html>
<head><meta charset="utf-8"><title>click</title></head>
<body>
  <button id="btn">click me</button>
  <button id="disabled" disabled>disabled</button>
  <div id="hidden" style="display:none">hidden</div>
  <span id="covered-wrap" style="position:relative;display:inline-block">
    <button id="covered">covered</button>
    <span id="overlay" style="position:absolute;inset:0;background:#fff"></span>
  </span>
  <button id="nav">nav</button>
  <p id="counter">0</p>
  <p id="hover-count">0</p>
  <p id="pointer">-</p>
  <script>
    const counter = document.getElementById('counter');
    document.getElementById('btn').addEventListener('click', (event) => {
      counter.textContent = String(Number(counter.textContent) + 1);
      document.getElementById('pointer').textContent = `${event.clientX},${event.clientY}`;
    });
    let hoverCount = 0;
    document.getElementById('btn').addEventListener('mouseover', () => {
      document.getElementById('hover-count').textContent = String(++hoverCount);
    });
    document.getElementById('nav').addEventListener('click', () => {
      location.href = 'locator-click-target.html';
    });
  </script>
</body>
</html>
